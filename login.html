<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin - APKZone</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 22px;
      border: 1px solid #eee;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    .logo {
      color: #5b5ff0;
      font-size: 26px;
      font-weight: 800;
    }

    .form-control {
      padding: 12px;
      border-radius: 12px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #5b5ff0;
      color: white;
      font-weight: 700;
    }

    .login-btn:hover {
      background: #494ddc;
    }

    .error {
      display: none;
      color: #dc3545;
      font-size: 14px;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="login-card">

  <div class="text-center mb-4">

    <div class="logo">
      <i class="bi bi-phone"></i> APKZone
    </div>

    <div class="text-secondary mt-1">
      Login Admin
    </div>

  </div>


  <div class="mb-3">

    <label class="form-label fw-semibold">
      Username
    </label>

    <input
      type="text"
      id="username"
      class="form-control"
      placeholder="Masukkan username"
      autocomplete="username">

  </div>


  <div class="mb-3">

    <label class="form-label fw-semibold">
      Password
    </label>

    <div class="input-group">

      <input
        type="password"
        id="password"
        class="form-control"
        placeholder="Masukkan password"
        autocomplete="current-password">

      <button
        class="btn btn-outline-secondary"
        type="button"
        onclick="lihatPassword()">

        <i class="bi bi-eye" id="eye"></i>

      </button>

    </div>

  </div>


  <button
    onclick="login()"
    class="login-btn">

    <i class="bi bi-box-arrow-in-right"></i>
    Login

  </button>


  <div id="error" class="error">
    Username atau password salah.
  </div>


  <div class="text-center mt-4">

    <a
      href="index.html"
      class="text-decoration-none text-secondary">

      <i class="bi bi-arrow-left"></i>
      Kembali ke APKZone

    </a>

  </div>

</div>


<script>

function login() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;


  /*
    LOGIN DEMO

    Ganti username dan password
    sesuai keinginan.
  */

  const usernameBenar = "admin";
  const passwordBenar = "123456";


  if (
    username === usernameBenar &&
    password === passwordBenar
  ) {

    sessionStorage.setItem(
      "apkzone_admin",
      "true"
    );

    window.location.href = "admin.html";

  } else {

    document.getElementById("error")
      .style.display = "block";

  }

}


function lihatPassword() {

  const password =
    document.getElementById("password");

  const eye =
    document.getElementById("eye");


  if (password.type === "password") {

    password.type = "text";

    eye.className = "bi bi-eye-slash";

  } else {

    password.type = "password";

    eye.className = "bi bi-eye";

  }

}


document
  .getElementById("password")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      login();
    }

  });

</script>

</body>
</html>
