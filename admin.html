<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - APKZone</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background: white;
      border-bottom: 1px solid #eee;
    }

    .logo {
      color: #5b5ff0;
      font-size: 23px;
      font-weight: 800;
      text-decoration: none;
    }

    .admin-card {
      max-width: 700px;
      margin: 35px auto;
      background: white;
      border-radius: 20px;
      padding: 25px;
      border: 1px solid #eee;
    }

    .form-control,
    .form-select {
      border-radius: 12px;
      padding: 12px;
    }

    .btn-main {
      background: #5b5ff0;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 700;
    }

    .btn-main:hover {
      background: #494ddc;
      color: white;
    }

    textarea {
      min-height: 250px;
      font-family: monospace;
      font-size: 13px;
    }

    .logout-btn {
      border-radius: 10px;
    }
  </style>
</head>
