<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Download APK - APKZone</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fb;
      color: #222;
      font-family: Arial, sans-serif;
    }

    body.dark {
      background: #10131a;
      color: #eee;
    }

    .navbar {
      background: white;
      border-bottom: 1px solid #eee;
    }

    body.dark .navbar {
      background: #191d25;
      border-color: #292e38;
    }

    .logo {
      color: #5b5ff0;
      font-size: 23px;
      font-weight: 800;
      text-decoration: none;
    }

    .download-card {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      border-radius: 22px;
      padding: 30px;
      border: 1px solid #eee;
    }

    body.dark .download-card {
      background: #191d25;
      border-color: #292e38;
    }

    .apk-icon {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      object-fit: cover;
    }

    .apk-name {
      font-size: 27px;
      font-weight: 800;
    }

    .download-btn {
      width: 100%;
      border: none;
      background: #5b5ff0;
      color: white;
      padding: 13px;
      border-radius: 13px;
      font-weight: 700;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .download-btn:hover {
      background: #494ddc;
      color: white;
    }

    .download-btn:disabled {
      opacity: .6;
    }

    .timer {
      font-size: 38px;
      font-weight: 800;
      color: #5b5ff0;
    }

    .ad-box {
      min-height: 90px;
      border: 1px dashed #ccc;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #999;
      margin: 25px 0;
    }
  </style>
</head>

<body>

<nav class="navbar">
  <div class="container py-3 d-flex justify-content-between align-items-center">

    <a href="index.html" class="logo">
      <i class="bi bi-phone"></i> APKZone
    </a>

    <button
      class="btn btn-sm btn-outline-secondary"
      onclick="toggleDark()">

      <i class="bi bi-moon" id="themeIcon"></i>

    </button>

  </div>
</nav>


<div class="container">

  <div id="content">

    <div class="download-card text-center">

      <img
        id="apkIcon"
        class="apk-icon"
        src="https://placehold.co/150x150"
        alt="APK">

      <h1 id="apkName" class="apk-name mt-3">
        Memuat...
      </h1>

      <p id="apkInfo" class="text-secondary">
        Memuat informasi...
      </p>


      <div class="ad-box">
        Tempat Iklan
      </div>


      <div class="py-3">

        <div id="timer" class="timer">
          10
        </div>

        <p id="status" class="text-secondary">
          File sedang dipersiapkan...
        </p>

      </div>


      <a
        id="downloadButton"
        href="#"
        class="download-btn d-none">

        <i class="bi bi-download"></i>
        Download APK

      </a>


      <a
        href="index.html"
        class="btn btn-link mt-3 text-decoration-none">

        <i class="bi bi-arrow-left"></i>
        Kembali

      </a>

    </div>

  </div>

</div>


<footer class="text-center py-4 text-secondary">
  © 2026 APKZone
</footer>


<!-- DATA APK -->
<script src="apks.js"></script>

<script>

  // Ambil ID APK dari URL
  const params = new URLSearchParams(window.location.search);
  const id = Number(params.get("id"));

  // Cari data APK
  const apk = apks.find(item => item.id === id);


  // Kalau APK tidak ditemukan
  if (!apk) {

    document.getElementById("content").innerHTML = `

      <div class="download-card text-center">

        <i class="bi bi-exclamation-circle fs-1 text-danger"></i>

        <h3 class="mt-3">
          APK tidak ditemukan
        </h3>

        <p class="text-secondary">
          Data aplikasi tidak tersedia.
        </p>

        <a href="index.html" class="btn btn-primary">
          Kembali ke APKZone
        </a>

      </div>

    `;

  } else {

    // Tampilkan informasi APK
    document.title = "Download " + apk.nama + " - APKZone";

    document.getElementById("apkIcon").src = apk.icon;

    document.getElementById("apkIcon").alt = apk.nama;

    document.getElementById("apkName").textContent =
      apk.nama;

    document.getElementById("apkInfo").textContent =
      apk.versi + " • " + apk.ukuran + " • " + apk.kategori;


    // Countdown
    let waktu = 10;

    const timer =
      document.getElementById("timer");

    const status =
      document.getElementById("status");

    const button =
      document.getElementById("downloadButton");


    const countdown = setInterval(() => {

      waktu--;

      timer.textContent = waktu;


      if (waktu <= 0) {

        clearInterval(countdown);

        timer.textContent = "✓";

        status.textContent =
          "File siap didownload.";

        button.href = apk.download;

        button.classList.remove("d-none");

      }

    }, 1000);

  }


  // DARK MODE
  function toggleDark() {

    document.body.classList.toggle("dark");

    const icon =
      document.getElementById("themeIcon");

    if (document.body.classList.contains("dark")) {

      icon.className = "bi bi-sun";

      localStorage.setItem("theme", "dark");

    } else {

      icon.className = "bi bi-moon";

      localStorage.setItem("theme", "light");

    }

  }


  // LOAD THEME
  if (localStorage.getItem("theme") === "dark") {

    document.body.classList.add("dark");

    document.getElementById("themeIcon").className =
      "bi bi-sun";

  }

</script>

</body>
</html>
