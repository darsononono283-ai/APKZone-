<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APKZone - Download APK</title>
<meta name="description" content="APKZone adalah tempat download aplikasi Android dengan cepat dan mudah.">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#151922;
}

.navbar{
    background:#fff;
    border-bottom:1px solid #e7e9ef;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:22px;
    font-weight:800;
    color:#5b5ff0;
}

.hero{
    background:linear-gradient(135deg,#5b5ff0,#7b61ff);
    color:white;
    padding:55px 20px;
    border-radius:0 0 30px 30px;
}

.hero h1{
    font-size:36px;
    font-weight:800;
}

.hero p{
    opacity:.9;
}

.search-box{
    max-width:650px;
    margin:25px auto 0;
}

.search-box input{
    height:52px;
    border:0;
    border-radius:15px;
    padding:0 20px;
    font-size:16px;
}

.section-title{
    font-weight:800;
    margin-bottom:20px;
}

.category{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:10px;
}

.category button{
    border:1px solid #ddd;
    background:white;
    padding:10px 18px;
    border-radius:30px;
    white-space:nowrap;
}

.category button.active{
    background:#5b5ff0;
    color:white;
    border-color:#5b5ff0;
}

.apk-card{
    background:white;
    border:1px solid #e8eaf0;
    border-radius:18px;
    padding:18px;
    height:100%;
    transition:.2s;
}

.apk-card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.apk-icon{
    width:65px;
    height:65px;
    border-radius:16px;
    object-fit:cover;
    background:#eee;
}

.apk-name{
    font-size:18px;
    font-weight:700;
    margin-top:12px;
}

.apk-info{
    color:#777;
    font-size:13px;
}

.download-btn{
    width:100%;
    border:0;
    background:#5b5ff0;
    color:white;
    padding:11px;
    border-radius:12px;
    font-weight:700;
    margin-top:12px;
}

.download-btn:hover{
    background:#494dd8;
}

.ad-box{
    min-height:100px;
    background:#fff;
    border:1px dashed #cfd2da;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#999;
    margin:25px 0;
}

footer{
    margin-top:50px;
    padding:30px 20px;
    background:#151922;
    color:#aaa;
}

body.dark{
    background:#10131a;
    color:#eee;
}

body.dark .navbar,
body.dark .apk-card,
body.dark .category button,
body.dark .ad-box{
    background:#181c25;
    border-color:#292e3a;
    color:#eee;
}

body.dark .apk-info{
    color:#aaa;
}

body.dark .category button{
    color:#eee;
}

.theme-btn{
    border:0;
    background:transparent;
    font-size:21px;
}
</style>
</head>

<body>

<nav class="navbar">
<div class="container py-3 d-flex align-items-center justify-content-between">

    <div class="logo">
        <i class="bi bi-box-arrow-down"></i> APKZone
    </div>

    <button class="theme-btn" onclick="toggleDark()">
        <i class="bi bi-moon-stars"></i>
    </button>

</div>
</nav>


<section class="hero text-center">

<div class="container">

    <h1>Download APK dengan Mudah</h1>

    <p>
        Temukan aplikasi Android favoritmu dengan cepat.
    </p>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Cari aplikasi..."
            onkeyup="searchAPK()">

    </div>

</div>

</section>


<main class="container py-4">

<div class="ad-box">
    AREA IKLAN
</div>


<h4 class="section-title">
    Kategori
</h4>


<div class="category mb-4">

<button class="active" onclick="filterAPK('Semua',this)">
    Semua
</button>

<button onclick="filterAPK('Editor',this)">
    Editor
</button>

<button onclick="filterAPK('Game',this)">
    Game
</button>

<button onclick="filterAPK('Musik',this)">
    Musik
</button>

<button onclick="filterAPK('Tools',this)">
    Tools
</button>

</div>


<h4 class="section-title">
    APK Terbaru
</h4>


<!-- APK AKAN MUNCUL DI SINI -->

<div class="row g-3" id="apkList"></div>


<div class="ad-box">
    AREA IKLAN
</div>

</main>


<footer>

<div class="container text-center">

<strong>APKZone</strong>

<p class="mb-0 mt-2">
Download aplikasi Android dengan mudah.
</p>

<p class="mt-3 mb-0">
© 2026 APKZone
</p>

</div>

</footer>


<script>

/* =================================
   DATA APK
================================= */

const apks = [

    {
        id: 1,
        nama: "VN Video Editor",
        versi: "2.5.1",
        ukuran: "120 MB",
        kategori: "Editor",
        icon: "https://placehold.co/150x150",
        deskripsi: "Aplikasi untuk mengedit video dengan berbagai fitur editing.",
        download: "https://example.com/vn.apk"
    },

    {
        id: 2,
        nama: "Spotify",
        versi: "Terbaru",
        ukuran: "85 MB",
        kategori: "Musik",
        icon: "https://placehold.co/150x150",
        deskripsi: "Aplikasi untuk menikmati musik dan podcast.",
        download: "https://example.com/spotify.apk"
    },

    {
        id: 3,
        nama: "Mobile Game",
        versi: "1.0.0",
        ukuran: "500 MB",
        kategori: "Game",
        icon: "https://placehold.co/150x150",
        deskripsi: "Game Android untuk mengisi waktu luang.",
        download: "https://example.com/game.apk"
    },

    {
        id: 4,
        nama: "File Manager",
        versi: "3.2",
        ukuran: "25 MB",
        kategori: "Tools",
        icon: "https://placehold.co/150x150",
        deskripsi: "Aplikasi untuk mengelola file di perangkat Android.",
        download: "https://example.com/filemanager.apk"
    }

];


/* =================================
   TAMPILKAN APK
================================= */

function tampilkanAPK(data = apks){

    const list =
        document.getElementById("apkList");

    if(data.length === 0){

        list.innerHTML = `
            <div class="col-12 text-center py-5">

                <i class="bi bi-search fs-1 text-muted"></i>

                <h5 class="mt-3">
                    APK tidak ditemukan
                </h5>

                <p class="text-muted">
                    Coba gunakan kata pencarian lain.
                </p>

            </div>
        `;

        return;
    }


    list.innerHTML = data.map(apk => `

        <div class="col-6 col-md-4 col-lg-3">

            <div class="apk-card">

                <img
                    src="${apk.icon}"
                    class="apk-icon"
                    alt="${apk.nama}">

                <div class="apk-name">
                    ${apk.nama}
                </div>

                <div class="apk-info">
                    Versi ${apk.versi}
                </div>

                <div class="apk-info">
                    ${apk.ukuran} • ${apk.kategori}
                </div>

                <button
                    class="download-btn"
                    onclick="bukaDetail(${apk.id})">

                    <i class="bi bi-download"></i>
                    Download

                </button>

            </div>

        </div>

    `).join("");

}


/* =================================
   SEARCH
================================= */

function searchAPK(){

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const hasil = apks.filter(apk =>
        apk.nama.toLowerCase().includes(keyword)
    );


    tampilkanAPK(hasil);

}


/* =================================
   FILTER KATEGORI
================================= */

function filterAPK(kategori,button){

    document
        .querySelectorAll(".category button")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    if(kategori === "Semua"){

        tampilkanAPK(apks);

        return;
    }


    const hasil =
        apks.filter(apk =>
            apk.kategori === kategori
        );


    tampilkanAPK(hasil);

}


/* =================================
   BUKA DETAIL
================================= */

function bukaDetail(id){

    window.location.href =
        "detail.html?id=" + id;

}


/* =================================
   DARK MODE
================================= */

function toggleDark(){

    document.body.classList.toggle("dark");

}


/* =================================
   JALANKAN SAAT HALAMAN DIBUKA
================================= */

tampilkanAPK();

</script>

</body>
</html>
