<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detail APK - APKZone</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fb;
      color: #222;
      font-family: Arial, sans-serif;
    }

    body.dark {
      background: #10131a;
      color: #eee;
    }

    .navbar {
      background: white;
      border-bottom: 1px solid #eee;
    }

    body.dark .navbar {
      background: #191d25;
      border-color: #292e38;
    }

    .logo {
      color: #5b5ff0;
      font-size: 23px;
      font-weight: 800;
      text-decoration: none;
    }

    .detail-card {
      background: white;
      border-radius: 22px;
      padding: 25px;
      margin-top: 30px;
      border: 1px solid #eee;
    }

    body.dark .detail-card {
      background: #191d25;
      border-color: #292e38;
    }

    .apk-icon {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 25px;
    }

    .apk-name {
      font-size: 28px;
      font-weight: 800;
    }

    .info {
      background: #f5f7fb;
      border-radius: 15px;
      padding: 15px;
      margin-top: 20px;
    }

    body.dark .info {
      background: #10131a;
    }

    .download-btn {
      display: block;
      width: 100%;
      background: #5b5ff0;
      color: white;
      text-decoration: none;
      text-align: center;
      padding: 13px;
      border-radius: 13px;
      font-weight: 700;
      margin-top: 20px;
    }

    .download-btn:hover {
      background: #494ddc;
      color: white;
    }

    .ad-box {
      min-height: 90px;
      border: 1px dashed #ccc;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      margin: 25px 0;
    }
  </style>
</head>

<body>

<nav class="navbar">
  <div class="container py-3 d-flex justify-content-between align-items-center">

    <a href="index.html" class="logo">
      <i class="bi bi-phone"></i> APKZone
    </a>

    <button class="btn btn-sm btn-outline-secondary" onclick="toggleDark()">
      <i class="bi bi-moon" id="themeIcon"></i>
    </button>

  </div>
</nav>


<div class="container">

  <div id="content">

    <div class="detail-card">

      <div class="text-center">

        <img
          id="apkIcon"
          class="apk-icon"
          src="https://placehold.co/150x150"
          alt="APK">

        <h1 class="apk-name mt-3" id="apkName">
          Memuat...
        </h1>

        <p class="text-secondary" id="apkMeta">
          Memuat informasi...
        </p>

      </div>


      <a id="downloadButton" class="download-btn" href="#">
        <i class="bi bi-download"></i>
        Download APK
      </a>


      <div class="ad-box">
        Tempat Iklan
      </div>


      <h5 class="fw-bold">
        <i class="bi bi-info-circle"></i>
        Tentang aplikasi
      </h5>

      <p id="apkDescription" class="text-secondary">
        Memuat deskripsi...
      </p>


      <div class="info">

        <div class="d-flex justify-content-between mb-3">
          <span>Versi</span>
          <strong id="apkVersion">-</strong>
        </div>

        <div class="d-flex justify-content-between mb-3">
          <span>Ukuran</span>
          <strong id="apkSize">-</strong>
        </div>

        <div class="d-flex justify-content-between mb-3">
          <span>Kategori</span>
          <strong id="apkCategory">-</strong>
        </div>

        <div class="d-flex justify-content-between">
          <span>Platform</span>
          <strong>Android</strong>
        </div>

      </div>

    </div>

  </div>

</div>


<footer class="text-center py-4 mt-5 text-secondary">
  © 2026 APKZone
</footer>


<!-- WAJIB: LOAD DATA APK -->
<script src="apks.js"></script>

<script>

  // Ambil ID dari URL
  const params = new URLSearchParams(window.location.search);
  const id = Number(params.get("id"));

  // Cari APK
  const apk = apks.find(item => item.id === id);


  // Kalau APK tidak ditemukan
  if (!apk) {

    document.getElementById("content").innerHTML = `
      <div class="detail-card text-center">
        <i class="bi bi-exclamation-circle fs-1 text-danger"></i>

        <h3 class="mt-3">
          APK tidak ditemukan
        </h3>

        <p class="text-secondary">
          Data aplikasi yang kamu cari tidak tersedia.
        </p>

        <a href="index.html" class="btn btn-primary">
          Kembali ke APKZone
        </a>
      </div>
    `;

  } else {

    // Isi data
    document.title = apk.nama + " - APKZone";

    document.getElementById("apkIcon").src = apk.icon;
    document.getElementById("apkIcon").alt = apk.nama;

    document.getElementById("apkName").textContent = apk.nama;

    document.getElementById("apkMeta").textContent =
      apk.versi + " • " + apk.ukuran;

    document.getElementById("apkVersion").textContent =
      apk.versi;

    document.getElementById("apkSize").textContent =
      apk.ukuran;

    document.getElementById("apkCategory").textContent =
      apk.kategori;

    document.getElementById("apkDescription").textContent =
      apk.deskripsi;

    document.getElementById("downloadButton").href =
      "download.html?id=" + apk.id;

  }


  // DARK MODE
  function toggleDark() {

    document.body.classList.toggle("dark");

    const icon = document.getElementById("themeIcon");

    if (document.body.classList.contains("dark")) {

      icon.className = "bi bi-sun";

      localStorage.setItem("theme", "dark");

    } else {

      icon.className = "bi bi-moon";

      localStorage.setItem("theme", "light");

    }

  }


  // LOAD THEME
  if (localStorage.getItem("theme") === "dark") {

    document.body.classList.add("dark");

    document.getElementById("themeIcon").className =
      "bi bi-sun";

  }

</script>

</body>
</html>
